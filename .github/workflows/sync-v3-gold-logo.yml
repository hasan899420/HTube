name: Sync HTube v3 gold logo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync gold logo source with deletion
        run: |
          set -e
          mkdir -p /tmp/extracted
          unzip -o HTube-v3-gold-logo.zip -d /tmp/extracted
          TOP=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | head -n 1)
          COUNT=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$COUNT" = "1" ] && [ -d "$TOP" ]; then SRC="$TOP"; else SRC="/tmp/extracted"; fi
          echo "Syncing from $SRC"
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='HTube-v3-gold-logo.zip' "$SRC"/ ./
          rm -rf /tmp/extracted
          rm -f HTube-v3-gold-logo.zip
          echo "Gold logo check:"
          ls app/src/main/res/drawable/ic_launcher_foreground.png
          ls app/src/main/res/drawable/htube_logo_banner.jpg
          ls app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -n 200
          git commit -m "Sync HTube v3 gold logo source (clean sync)" || echo "Nothing to commit"
          git push
