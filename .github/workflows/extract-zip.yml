name: Extract HTube source archive
on:
  workflow_dispatch:
permissions:
  contents: write
  workflows: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive
        run: |
          set -e
          ls -la
          mkdir -p /tmp/extracted
          unzip -o HTube-v1.zip -d /tmp/extracted
          echo "Extracted top-level:"
          ls -la /tmp/extracted
          TOP=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | head -n 1)
          COUNT=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$COUNT" = "1" ] && [ -d "$TOP" ]; then
            cp -a "$TOP/." .
          else
            cp -a /tmp/extracted/. .
          fi
          rm -rf /tmp/extracted
          rm -f HTube-v1.zip
          rm -f .github/workflows/extract-zip.yml
          echo "File count after extraction:"
          find . -path ./.git -prune -o -type f -print | wc -l
          ls -la
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -n 100
          git commit -m "Extract HTube source from HTube-v1.zip" || echo "Nothing to commit"
          git push
