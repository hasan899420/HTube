name: Extract HTube source archive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive
        run: |
          set -e
          mkdir -p /tmp/extracted
          unzip -o HTube-v1.zip -d /tmp/extracted
          TOP=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | head -n 1)
          COUNT=$(find /tmp/extracted -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$COUNT" = "1" ] && [ -d "$TOP" ]; then
            cp -a "$TOP/." .
          else
            cp -a /tmp/extracted/. .
          fi
          rm -rf /tmp/extracted
          rm -f HTube-v1.zip
          echo "Total files in workspace:"
          find . -path ./.git -prune -o -type f -print | wc -l
          echo "Workflow files present in archive (not committed by this bot token):"
          ls -la .github/workflows/
      - name: Show source workflow files for manual re-creation
        run: |
          echo "=== ci.yml ==="
          cat .github/workflows/ci.yml || true
          echo "=== release.yml ==="
          cat .github/workflows/release.yml || true
      - name: Commit extracted source excluding workflow files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git status --short | head -n 200
          git commit -m "Extract HTube source from HTube-v1.zip (workflow files excluded)" || echo "Nothing to commit"
          git push
