name: Sync v10 bugfixes source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/v10 && unzip -q HTube-v10-bugfixes.zip -d /tmp/v10
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude 'HTube-v10-bugfixes.zip' /tmp/v10/ ./
          rm -f HTube-v10-bugfixes.zip
          git config user.name "hasan899420"
          git config user.email "hasan899420@users.noreply.github.com"
          git add -A
          git commit -m "Sync HTube v10 bugfixes source" || echo "no changes"
          git push
