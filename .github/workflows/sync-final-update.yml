name: Sync final update source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/final && unzip -q HTube-final-update.zip -d /tmp/final
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude 'HTube-final-update.zip' /tmp/final/ ./
          rm -f HTube-final-update.zip
          git config user.name "hasan899420"
          git config user.email "hasan899420@users.noreply.github.com"
          git add -A
          git commit -m "Sync HTube final update source" || echo "no changes"
          git push
